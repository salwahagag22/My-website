<html>
<head>
    <title>Log In</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
       <style>
      body{
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: radial-gradient(circle at top right, #2d2d80, #000);
        background-size: cover;
        background-position: center;
    }
        .page-login{
            width: 600px;
            background-color: transparent;
            border: 20px solid rgba( 225, 225, 225, 0.2);
            backdrop-filter: blur(20px);
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            color:#fff ;
            padding: 70px 80px;
            border-radius: 15px;
            min-height: 500px;
    }
        .page-login h1{
            font-size: 36px;
            text-align: center;
        }
        .page-login .input-login{
            position: relative;
            width: 100%;
            height: 50px;
            margin: 30px 0;
        }
        .input-login input{
            width:  100%;
            height: 100%;
            background: transparent;
            outline: none;
            border: 2px solid rgba(225, 225, 225, 0.2);
            border-radius: 40px;
            font-size: 16px;
            color: grey;
            padding: 20px 45px 20px  20px;
        }
         .input-login input::placeholder{
            color: #fff;
        }
        .input-login i{
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
        }
        .page-login .remember-login{
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            margin: -15px 0 15px;
        }
        .remember-login label input{
            margin-right:3px;
        }
        .remember-login a{
            color: #fff;
            text-decoration: none;
        }
        .remember-login a:hover{
            text-decoration: underline;
        }
     .page-login .btn{
       display: block;
            font-size: 20px;
            border-radius: 40px;
            width: 200px;
            height: 45px;
            border: none;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            margin:0 auto;
            color: #fff;
            font-weight: 500;
            background-color: #4e34b6;
        }
        .page-login .Register{
            font-size: 15px;
            text-align: center;
            margin: 20px 0 15px;
        }
        .Register p a{
            color: #fff;
            text-decoration: none;
        }
        .Register p a:hover{
            text-decoration: underline;
        }
        </style>
</head>
<body>
 <div class="page-login">
    <form action="">
        <h1>Login</h1>
        <div class="input-login">
            <input type="text" placeholder="Username"required>
            <i class='bx bxs-user-circle'></i>
        </div>
        <div class="input-login">
            <input type="password" placeholder="Password"required>
            <i class='bx bxs-lock'></i>
        </div>
        <div class="remember-login">
            <label><input type="checkbox">Remember me</label>
            <a href="#">Forget password?</a>
        </div>
        <button type="submit"class="btn">submit</button>
        <div class="Register">
            <p>Don't have an account?
            <a href="#">Register</a> </p>
        </div>
        </form>
        </div>
</body>
</html>
